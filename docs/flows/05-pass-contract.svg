<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img">
<title>Keystone contract</title>
<desc>An operator creates and deploys a KeystonePass from the operator wallet with metadata and transfer rules on chain; metadata and transfers can each be changed until locked forever, and members' keystones follow the rules while operator burns always work.</desc>
<style>
  .bg{fill:#FFFFFF}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500;fill:#2C2C2A}
  .ts{font-size:12px;fill:#5F5E5A}
  .arr{stroke:#888780;stroke-width:1.5;fill:none}
  .frame{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 3}
  .c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
  @media (prefers-color-scheme:dark){
    .bg{fill:#1F1F1E}.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.frame{stroke:#5F5E5A}
    .c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
    .c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#CECBF6}
    .c-coral rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#FAECE7}.c-coral .ts{fill:#F5C4B3}
    .c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="530"/>
<g class="c-purple"><rect x="170" y="40" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Create keystone contract</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Name, artwork, text, transfer option</text></g>
<line x1="340" y1="96" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="170" y="130" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Deploy from operator wallet</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Metadata and rules written on chain</text></g>
<path d="M340 186 L340 208 L190 208 L190 238" class="arr" marker-end="url(#arrow)"/>
<path d="M340 208 L490 208 L490 238" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="240" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="258" text-anchor="middle" dominant-baseline="central">Metadata</text><text class="ts" x="190" y="278" text-anchor="middle" dominant-baseline="central">Edit description, inscription, art</text></g>
<g class="c-purple"><rect x="360" y="240" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="490" y="258" text-anchor="middle" dominant-baseline="central">Transfers</text><text class="ts" x="490" y="278" text-anchor="middle" dominant-baseline="central">Allow or block any time</text></g>
<line x1="190" y1="296" x2="190" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="296" x2="490" y2="328" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="330" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="348" text-anchor="middle" dominant-baseline="central">Lock metadata (optional)</text><text class="ts" x="190" y="368" text-anchor="middle" dominant-baseline="central">Permanent, can't be edited</text></g>
<g class="c-gray"><rect x="360" y="330" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="490" y="348" text-anchor="middle" dominant-baseline="central">Lock rule (optional)</text><text class="ts" x="490" y="368" text-anchor="middle" dominant-baseline="central">Permanent allow or block</text></g>
<line x1="190" y1="386" x2="190" y2="428" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="386" x2="490" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="130" y="430" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="448" text-anchor="middle" dominant-baseline="central">Member keystones</text><text class="ts" x="340" y="468" text-anchor="middle" dominant-baseline="central">Non-transferable keystones stay put · burn revokes</text></g>
<rect class="c-purple" x="40" y="500" width="12" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="506" dominant-baseline="central">Operator actions</text><rect class="c-gray" x="190" y="500" width="12" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="210" y="506" dominant-baseline="central">Permanent, one-way</text><rect class="c-teal" x="350" y="500" width="12" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="370" y="506" dominant-baseline="central">Effect on members</text>
</svg>
