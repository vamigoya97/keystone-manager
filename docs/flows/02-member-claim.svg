<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>Member claim flow</title>
<desc>A chip tap is verified, the keystone page offers sign-in and a gas-free mint, and the member lands in the private gallery; side branches show failed verification, locked claims, existing holders and refused mints.</desc>
<style>
  .bg{fill:#FFFFFF}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500;fill:#2C2C2A}
  .ts{font-size:12px;fill:#5F5E5A}
  .arr{stroke:#888780;stroke-width:1.5;fill:none}
  .frame{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 3}
  .c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
  @media (prefers-color-scheme:dark){
    .bg{fill:#1F1F1E}.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.frame{stroke:#5F5E5A}
    .c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
    .c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#CECBF6}
    .c-coral rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#FAECE7}.c-coral .ts{fill:#F5C4B3}
    .c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="520"/>
<g class="c-teal"><rect x="60" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">Tap item</text><text class="ts" x="190" y="78" text-anchor="middle" dominant-baseline="central">/x/:slug/tap · opens the claim screen</text></g>
<g class="c-teal"><rect x="60" y="130" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="148" text-anchor="middle" dominant-baseline="central">Claim screen</text><text class="ts" x="190" y="168" text-anchor="middle" dominant-baseline="central">Mint button once the chip is verified</text></g>
<g class="c-teal"><rect x="60" y="220" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="238" text-anchor="middle" dominant-baseline="central">Sign in with Privy</text><text class="ts" x="190" y="258" text-anchor="middle" dominant-baseline="central">SMS · embedded wallet created</text></g>
<g class="c-teal"><rect x="60" y="310" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="328" text-anchor="middle" dominant-baseline="central">Server mints keystone</text><text class="ts" x="190" y="348" text-anchor="middle" dominant-baseline="central">Operator wallet pays gas</text></g>
<g class="c-teal"><rect x="60" y="400" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="418" text-anchor="middle" dominant-baseline="central">Private gallery</text><text class="ts" x="190" y="438" text-anchor="middle" dominant-baseline="central">Signed photo links, 1 hour</text></g>
<line x1="190" y1="96" x2="190" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="186" x2="190" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="276" x2="190" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="366" x2="190" y2="398" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="380" y="40" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="58" text-anchor="middle" dominant-baseline="central">Not verified</text><text class="ts" x="495" y="78" text-anchor="middle" dominant-baseline="central">Tap the item again</text></g>
<g class="c-coral"><rect x="380" y="130" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="148" text-anchor="middle" dominant-baseline="central">No tap, no keystone</text><text class="ts" x="495" y="168" text-anchor="middle" dominant-baseline="central">Button locked: tap to claim</text></g>
<g class="c-teal"><rect x="380" y="220" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="238" text-anchor="middle" dominant-baseline="central">Already a holder</text><text class="ts" x="495" y="258" text-anchor="middle" dominant-baseline="central">Enter gallery directly</text></g>
<g class="c-coral"><rect x="380" y="310" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="328" text-anchor="middle" dominant-baseline="central">Mint refused</text><text class="ts" x="495" y="348" text-anchor="middle" dominant-baseline="central">Chip used or access revoked</text></g>
<line x1="320" y1="68" x2="378" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="148" x2="378" y2="148" class="arr" marker-end="url(#arrow)"/>
<path d="M320 172 L350 172 L350 248 L378 248" class="arr" marker-end="url(#arrow)"/>
<path d="M610 248 L625 248 L625 428 L322 428" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="338" x2="378" y2="338" class="arr" marker-end="url(#arrow)"/>
<rect class="c-teal" x="40" y="484" width="12" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="490" dominant-baseline="central">Path to access</text><rect class="c-coral" x="180" y="484" width="12" height="12" rx="3" stroke-width="0.5"/><text class="ts" x="200" y="490" dominant-baseline="central">Blocked, user sees why</text>
</svg>
